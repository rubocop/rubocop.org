---
name: Merge RuboCop updates

# Everything the site shows about RuboCop comes from its bundle, so a release
# is only on the site once Dependabot's update is merged. This merges the
# update when every check on it has passed, apart from a major release, which
# changes enough of the site to want a look first.
"on":
  workflow_run:
    workflows: [Specs, Linting, Deploy to GitHub pages, Spell Checking]
    types: [completed]
    branches: ["dependabot/bundler/rubocop-**"]

permissions: {}

concurrency:
  group: merge-${{ github.event.workflow_run.head_branch }}

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
      && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
      # to start the deploy
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge once every check has passed
        run: |
          open=$(gh api "repos/$GH_REPO/pulls/$PR" --jq '
            select(.state == "open" and .head.sha == env.SHA
                   and .user.login == "dependabot[bot]"
                   and .head.repo.full_name == env.GH_REPO) | .number')
          if [ -z "$open" ]; then
            echo "#$PR isn't an open update at $SHA"
            exit 0
          fi
          message=$(gh api "repos/$GH_REPO/commits/$SHA" --jq .commit.message)
          if grep -q 'version-update:semver-major' <<< "$message"; then
            echo "#$PR has a major update, which gets a look before it's merged"
            exit 0
          fi
          # Each workflow above runs this when it completes, so only the last
          # one to finish gets past here.
          running=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA" --jq '
            [.workflow_runs[] | select(.status != "completed")] | length')
          checks="repos/$GH_REPO/commits/$SHA/check-runs?per_page=100"
          failing=$(gh api "$checks" --jq '
            [.check_runs[]
             | select(.conclusion | IN("success", "skipped", "neutral") | not)]
            | length')
          if [ "$running" != 0 ] || [ "$failing" != 0 ]; then
            echo "#$PR: $running workflows running, $failing checks not passed"
            exit 0
          fi
          gh pr merge "$PR" --rebase --match-head-commit "$SHA"
          # A merge with this token doesn't start the deploy by itself.
          gh workflow run gh-pages.yml --ref main
