---
name: Deploy to GitHub pages

"on":
  push:
    branches:
      - main
  # The site shows live data (releases, stars, posts), so rebuild it weekly
  # and whenever a RuboCop release asks for it.
  schedule:
    - cron: "17 5 * * 1"
  repository_dispatch:
    types: [rubocop-release]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BRIDGETOWN_ENV: production
      BASE_PATH: >-
        ${{ github.repository != 'rubocop/rubocop.org'
            && '/rubocop.org' || '/' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install

      - name: Build
        run: bin/bridgetown deploy
        env:
          # avoids the anonymous rate limit of the GitHub API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./output

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
