---
name: Deploy to GitHub pages

"on":
  push:
    branches:
      - main
  # Pull requests only build, so a change that breaks the site fails its
  # checks instead of the next deploy.
  pull_request:
  # The site shows live data (releases, stars, posts), so rebuild it daily.
  schedule:
    - cron: "17 5 * * *"
  # RuboCop's release workflow sends this once a release is out, so the
  # release shows up right away.
  repository_dispatch:
    types: [rubocop-release]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# PRs run here too, so the build only gets to read. The deploy job asks for
# what it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRIDGETOWN_ENV: production
      BASE_PATH: >-
        ${{ github.repository != 'rubocop/rubocop.org'
            && '/rubocop.org' || '/' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install

      - name: Build
        run: bin/bridgetown deploy
        env:
          # avoids the anonymous rate limit of the GitHub API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the pages in a browser
        run: bin/check-pages.js

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./output

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
