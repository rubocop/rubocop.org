---
plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    # Offends on purpose, for the examples on the home page.
    - demo/**/*

Lint/SuppressedException:
  Exclude:
    - Rakefile

Metrics/BlockLength:
  Exclude:
    - spec/**/*

RSpec/ExampleLength:
  CountAsOne:
    - array
    - heredoc
